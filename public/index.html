<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Givit</title>
    <meta name="description" content="Beautiful gifts for every story worth celebrating." />
    <meta name="theme-color" content="#004CFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Givit" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      input,
      textarea {
        outline: none !important;
        box-shadow: none !important;
        border: none !important;
        -webkit-appearance: none;
        appearance: none;
      }
      input:focus,
      textarea:focus {
        outline: none !important;
        box-shadow: none !important;
        border: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              reg.update();
              setInterval(function () {
                reg.update();
              }, 60 * 1000);
              reg.addEventListener('updatefound', function () {
                var installing = reg.installing;
                if (!installing) return;
                installing.addEventListener('statechange', function () {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new Event('givit-sw-update'));
                  }
                });
              });
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
